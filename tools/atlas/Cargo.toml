# Own workspace, so the app's `cargo check` builds no HTTP stack or image codec.
[workspace]

[package]
name = "atlas"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
reqwest = { version = "0.13", features = ["blocking", "native-tls", "gzip"], default-features = false }
serde_json = "1"
