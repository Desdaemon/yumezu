[package]
name = "dreamweaver"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "http2", "query", "rustls-no-provider"] }
bitflags = "2.13"
yumezu_routing.path = "../yumezu_routing"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
