# Serving the dump through nginx.
#
# Nothing is cached here -- the server answers every request from a file it already holds in
# memory, and a copy in nginx would only be a second thing to invalidate. What nginx adds is what
# it can say to the readers downstream, which the server itself says nothing about.

server {
    listen 80;
    server_name yumezu.example;

    # Six hours because that is `--sync-every`: the file cannot change before then, since the only
    # thing that starts a sync is a request arriving after the last one went stale. So this is not
    # a guess about how long the dump stays good, it is the whole of what decides it. Change one
    # of the two numbers and change the other.
    #
    # No `always`, and that is the load-bearing part: `add_header` without it touches 2xx and 3xx
    # only, so the `503 needs update` goes out with no freshness at all and is stored by nobody.
    # `always` would put six hours on the 503 as well, and every reader that met one would be told
    # to wait until tea time for a sync that takes a minute.
    location ~ ^/data(\.json)?$ {
        proxy_pass http://127.0.0.1:5000;
        add_header Cache-Control "public, max-age=21600";
    }

    # The route whose whole content is that it changes between two identical asks. It is a `GET`,
    # so a browser or a proxy downstream would otherwise be free to answer the second from the
    # first, and a reader would sit out a sync that had already finished. `always` here for the
    # opposite reason to above: whatever this answers, it is never worth keeping.
    location = /pollUpdate {
        proxy_pass http://127.0.0.1:5000;
        add_header Cache-Control "no-store" always;
    }
}
