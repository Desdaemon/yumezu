[package]
name = "yumezu"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
members = [
  ".",
  "crates/*"
]

[lib]
crate-type = ["cdylib"]

# Not `yumezu`: trunk cannot tell it from the lib target (`found more than one target artifact`).
[[bin]]
name = "yumezu_main"
path = "src/main.rs"

[features]
# Per-frame cost report and GPU pass timers in the settings tab; never shipped.
profile = []

# `cargo packager` builds nothing; `just package` builds the binary into `binariesDir` first.
# `App` and `Nsis` write a broken package on the wrong host, so every caller passes `--formats`.
[package.metadata.packager]
productName = "yumezu"
identifier = "dev.yumemiru.yumezu"
description = "A 3D graph of every world in Yume 2kki"
category = "Reference"
homepage = "https://explorer.yumemiru.dev"
formats = ["appimage", "nsis", "app", "dmg"]
# Prebuilt `.icns`: 1024x1024 has no 1x icns type, so `icon.png` alone fails `No matching IconType`.
icons = ["icons/icon.png", "icons/icon.icns"]
outDir = "target/packages"

[package.metadata.packager.nsis]
installerIcon = "icons/icon.ico"

[profile.min]
inherits = "release"
opt-level = "z"
# LTO would run the vectorizers at this `opt-level`, ignoring the force_graph_3d override below.
lto = false
codegen-units = 1
panic = "abort"
strip = true

# Its loops vectorize only once unrolled; `crates/force_graph_3d/tests/codegen.rs` asserts it.
[profile.min.package.force_graph_3d]
opt-level = 3

[dependencies]
force_graph_3d.path = "./crates/force_graph_3d"
yumezu_routing.path = "./crates/yumezu_routing"
log = "0.4.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2.3"
three-d = { version = "0.20.0", git = "https://github.com/asny/three-d" }
# Depended on only to enable features.
three-d-asset = { version = "0.10", features = ["jpeg", "png"] }
# Already pulled by `three-d-asset`; resamples before upload.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2", "system-proxy", "rustls-no-provider"] }
winit = "0.30"
# `std::time::Instant` panics on wasm.
web-time = "1"
# `wasmbind` reads the page's timezone offset off `Date`.
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
egui_material_icons = "0.7.0"
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
# Pinned by egui_material_icons.
egui = "0.35"
# upgrade blocked by https://github.com/emilk/egui/issues/8436
egui-winit = { version = "0.35", default-features = false }
egui_glow = { version = "0.35", default-features = false }
skrifa = "0.44"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# aws-lc-rs costs ~900KiB over ring for the same suites.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
fontique = { version = "0.11", default-features = false, features = ["system"] }
egui-winit = { version = "0.35", default-features = false, features = ["clipboard"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
reqwest-middleware = "0.5.2"
http-cache-reqwest = "=1.0.0-alpha.8"
# Must match the version `http-cache-reqwest` builds against.
redb = "4.2"
http = "1.5"

[target.'cfg(all(not(target_family = "wasm"), not(target_os = "android")))'.dependencies]
env_logger = { version = "0.11", default-features = false }
# Carries a second, older reqwest; desktop has no size budget.
cargo-packager-updater = "0.2"

[target.'cfg(target_family = "wasm")'.dependencies]
sys-locale = { version = "0.3", features = ["js"] }
tokio = { version = "1.53.1", features = ["macros"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2.127"
console_log = "1.1.0"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.104", features = [
  "Location", "MediaQueryList", "Navigator", "Storage", "UrlSearchParams", "Window",
  "CompositionEvent", "CssStyleDeclaration", "Document", "Element", "Event", "EventTarget",
  "FocusOptions", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "InputEvent",
  "KeyboardEvent", "Node",
] }


[target.'cfg(target_family = "wasm")'.dev-dependencies]
# Must match `wasm-bindgen` and its CLI exactly.
wasm-bindgen-test = "=0.3.77"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.15"
jni = "0.22"
ndk-context = "0.1"
# Compiled-in TLS roots; see `src/fetch.rs`.
webpki-root-certs = "1"
