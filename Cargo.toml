[package]
name = "yumezu"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
members = [
  ".",
  "crates/*"
]

[lib]
crate-type = ["cdylib"]

# Not `yumezu`: the lib target is already that, and trunk cannot tell two artifacts of one name
# apart -- `found more than one target artifact`. The name reaches the desktop packages as the
# installed file name, which `productName` below overrides everywhere a person reads it.
[[bin]]
name = "yumezu_main"
path = "src/main.rs"

[features]
production = []
# Builds `src/profile.rs` in place of its do-nothing stand-in: a report of what a frame cost every
# couple of seconds, the GPU's own clock over the whole frame or over each pass, and the switches
# for both in the settings tab. Native only, and never shipped.
profile = []

# Desktop packaging. `cargo packager` reads this table but does not build anything: the binary has
# to exist under `binariesDir` first, which is why `just package` builds before packaging. Keys are
# camelCase because the config denies unknown fields and only some of them carry a kebab alias.
#
# No wix: an NSIS installer is what a person double-clicks, and dropping it keeps the WiX toolchain
# off the Windows runner entirely. Both formats are what `cargo-packager-updater` can replace in
# place -- see `src/update.rs`.
[package.metadata.packager]
productName = "yumezu"
identifier = "dev.yumemiru.yumezu"
description = "A 3D graph of every world in Yume 2kki"
category = "Reference"
homepage = "https://explorer.yumemiru.dev"
formats = ["appimage", "nsis"]
icons = ["icons/icon.png"]
outDir = "target/packages"
# Read at runtime rather than compiled in, the same as on the page and in the apk -- see
# `src/thumbnails.rs`, which is also what knows where each format puts them.
# Mapped rather than bare paths: a bare one is copied by its file name alone, and both formats have
# to keep the `static/` the three targets share.
resources = [
  { src = "static/thumbnails.jpg", target = "static/thumbnails.jpg" },
  { src = "static/unknown_location.png", target = "static/unknown_location.png" },
]

[package.metadata.packager.nsis]
installerIcon = "icons/icon.ico"

[profile.min]
inherits = "release"
opt-level = "z"
# Off so that the override below can take effect. Both LTO modes defer the vectorizers to the
# post-link pipeline, which runs at the `opt-level` above and ignores per-package ones, and a
# size level there turns off the unroller that the force-graph hot loops need widened before
# anything can vectorize them. Measured, this pairing is also the smallest the application has
# been after brotli. See `crates/force_graph_3d/IMPL_DETAILS.md`.
lto = false
codegen-units = 1
panic = "abort"
strip = true

# The one crate that is compiled for speed. Its inner loops are fixed-width and have to be
# unrolled before they vectorize at all; at a size level they run one lane at a time and the
# `+simd128` in `.cargo/config.toml` buys nothing.
# `crates/force_graph_3d/tests/codegen.rs` fails if this goes away.
[profile.min.package.force_graph_3d]
opt-level = 3

[dependencies]
force_graph_3d.path = "./crates/force_graph_3d"
log = "0.4.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
three-d = { version = "0.20.0", git = "https://github.com/asny/three-d" }
# explicitly depended to override features
three-d-asset = { version = "0.10", features = ["jpeg", "png", "http-rustls"] }
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2", "system-proxy", "json", "query", "stream", "rustls-no-provider"] }
winit = "0.30"
# `std::time::Instant` panics on the page; this is the same type everywhere else.
web-time = "1"
egui_material_icons = "0.7.0"
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
# pinned via egui_material_icons
egui = "0.35"
# upgrade blocked by https://github.com/emilk/egui/issues/8436
egui-winit = { version = "0.35", default-features = false }
egui_glow = { version = "0.35", default-features = false }
# to help with measuring different fonts' baselines
skrifa = "0.44"
phf = { version = "0.14.0", features = ["macros"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Named only to pick the provider. Both are compiled in if anything in the graph asks for the
# other, and aws-lc-rs costs ~900KiB of the binary over ring for the same suites.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
fontique = { version = "0.11", default-features = false, features = ["system"] }
egui-winit = { version = "0.35", default-features = false, features = ["clipboard"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
reqwest-middleware = "0.5.2"
http-cache-reqwest = "=1.0.0-alpha.8"
http = "1.5"

[target.'cfg(all(not(target_family = "wasm"), not(target_os = "android")))'.dependencies]
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
# The two desktop packages replace themselves through this; see `src/update.rs`. It carries its own
# reqwest, a major behind the one above, so the desktop binary holds two -- desktop being the one
# target here with no size budget.
cargo-packager-updater = "0.2"

[target.'cfg(target_family = "wasm")'.dependencies]
sys-locale = { version = "0.3", features = ["js"] }
tokio = { version = "1.53.1", features = ["macros"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2.127"
console_log = "1.1.0"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.104", features = [
  "Location", "Navigator", "Storage", "Window",
  # used by text_agent.rs
  "CompositionEvent", "CssStyleDeclaration", "Document", "Element", "Event", "EventTarget",
  "FocusOptions", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "InputEvent",
  "KeyboardEvent", "Node",
] }


[target.'cfg(target_family = "wasm")'.dev-dependencies]
# Pinned to `wasm-bindgen` itself, which the CLI generating the glue must also match exactly.
wasm-bindgen-test = "=0.3.77"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.15"
jni = "0.22"
ndk-context = "0.1"
# to handle TLS certs removed from reqwest
webpki-root-certs = "1"
