<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yumezu</title>
    <link data-trunk rel="icon" href="icons/favicon.png"/>
    <link data-trunk rel="scss" href="static/index.scss"/>
    <link data-trunk rel="copy-file" href="static/thumbnails.jpg" data-target-path="static"/>
    <link data-trunk rel="copy-file" href="static/unknown_location.png" data-target-path="static"/>
    <link data-trunk rel="rust" data-target-name="yumezu"/>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <!-- Shown until the app's first frame replaces it. -->
    <div id="loading"><span id="loading-text">Loading worlds…</span></div>
    <script>
      // Mirrors `src/i18n.rs` and `dump-loading` in `locales/`, before the app can read either.
      const named = new URLSearchParams(location.search).get("lang");
      if ((named || navigator.language || "").startsWith("ja"))
        document.getElementById("loading-text").textContent = "読み込み中...";
    </script>
  </body>
</html>
