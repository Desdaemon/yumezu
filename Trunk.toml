[serve]
port = 5001
 
# The page fetches only from its own host; `just dreamweaver` must run alongside.
[[proxy]]
rewrite = "/data"
backend = "http://127.0.0.1:5000/data"

[[proxy]]
rewrite = "/pollUpdate"
backend = "http://127.0.0.1:5000/pollUpdate"

# YNOproject allows one origin; `dreamweaver` relays it and rehosts its session cookie here.
[[proxy]]
rewrite = "/yno/"
backend = "http://127.0.0.1:5000/yno/"

[[proxy]]
rewrite = "/ynoauth/"
backend = "http://127.0.0.1:5000/ynoauth/"

# The wiki answers 403 unless `Origin` is its own, a header no browser lets the page set.
[[proxy]]
rewrite = "/img/"
backend = "https://yume.wiki/images/"
request_headers = { origin = "https://explorer.yume.wiki" }
