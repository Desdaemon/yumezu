# `latest.json` on the release is the whole update server; see `src/update.rs`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PACKAGER: cargo-packager@0.11.8

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: The tag has to be the version the packages will announce
        id: version
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          # An installed copy compares `latest.json` against its `CARGO_PKG_VERSION`.
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not Cargo.toml's $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Each fails silently or an hour in; a debug-signed apk can never upgrade a release one.
      - name: The keys have to be here before four runners spend an hour
        env:
          PUBKEY: ${{ vars.YUMEZU_UPDATE_PUBKEY }}
          SIGN_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          set -euo pipefail
          missing=
          [ -n "$PUBKEY" ] || missing="$missing YUMEZU_UPDATE_PUBKEY(variable)"
          [ -n "$SIGN_KEY" ] || missing="$missing CARGO_PACKAGER_SIGN_PRIVATE_KEY"
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE"
          if [ -n "$missing" ]; then
            echo "::error::unset:$missing"
            exit 1
          fi

          # Actions secrets are UTF-8 only, so the keystore is base64.
          printf '%s' "$KEYSTORE" | base64 -d > /dev/null 2>&1 \
            || { echo "::error::ANDROID_KEYSTORE does not decode as base64"; exit 1; }

  # `.app` is what the updater replaces, so signing tars it to `yumezu.app.tar.gz`.
  desktop:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: appimage
            formats: appimage
          - os: windows-latest
            name: nsis
            formats: nsis
          - os: macos-15
            name: macos
            formats: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,${{ env.PACKAGER }}

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      # The pubkey is compiled in.
      - run: cargo build --release --locked --bin yumezu_main
        env:
          YUMEZU_UPDATE_PUBKEY: ${{ vars.YUMEZU_UPDATE_PUBKEY }}

      - run: cargo packager --release --formats ${{ matrix.formats }}
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy's strip cannot read `.relr.dyn` and fails fatally.
          NO_STRIP: 1
          # No FUSE on a runner, and linuxdeploy is an AppImage.
          APPIMAGE_EXTRACT_AND_RUN: 1

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            target/packages/*.AppImage*
            target/packages/*setup.exe*
            target/packages/*.app.tar.gz*
            target/packages/*.dmg*
          if-no-files-found: error

  apk:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # Outside the checkout so nothing packages it as a resource.
      - name: Decode the release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/production.jks"

      - run: just apk
        env:
          YUMEZU_KEYSTORE: ${{ runner.temp }}/production.jks
          YUMEZU_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}

      # `RUNNER_TEMP` outlives a self-hosted runner's job.
      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/production.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: target/android/yumezu.apk
          if-no-files-found: error

  release:
    needs: [plan, desktop, apk]
    runs-on: ubuntu-latest
    steps:
      # Whole history: the notes are the commits since the previous tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Write the update manifest and the notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          DOWNLOAD: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          set -euo pipefail
          appimage=$(basename packages/*.AppImage)
          nsis=$(basename packages/*setup.exe)
          dmg=$(basename packages/*.dmg)
          # The updater cannot mount a dmg.
          app=$(basename packages/*.app.tar.gz)

          # Each signature is quoted, as the updater expects, from the `.sig` beside its package.
          python3 - "$appimage" "$nsis" "$app" > latest.json <<'PY'
          import datetime, json, os, pathlib, sys

          def platform(name, format):
              return {
                  "url": f"{os.environ['DOWNLOAD']}/{name}",
                  "signature": pathlib.Path("packages", f"{name}.sig").read_text().strip(),
                  "format": format,
              }

          appimage, nsis, app = sys.argv[1:4]
          print(json.dumps({
              "version": os.environ["VERSION"],
              "pub_date": datetime.datetime.now(datetime.UTC).isoformat(timespec="seconds"),
              "platforms": {
                  "linux-x86_64": platform(appimage, "appimage"),
                  "windows-x86_64": platform(nsis, "nsis"),
                  "macos-aarch64": platform(app, "app"),
              },
          }, indent=2))
          PY

          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          changes=$(git log --no-merges --format='- %s' "${previous:+$previous..}$GITHUB_REF_NAME")

          # A literal `$` in `.github/release-notes.md` is written `$$`.
          APPIMAGE="$appimage" NSIS="$nsis" DMG="$dmg" CHANGES="$changes" python3 - > notes.md <<'PY'
          import os, pathlib, string

          template = string.Template(pathlib.Path(".github/release-notes.md").read_text())
          print(
              template.substitute(
                  appimage=os.environ["APPIMAGE"],
                  nsis=os.environ["NSIS"],
                  dmg=os.environ["DMG"],
                  changes=os.environ["CHANGES"],
              ),
              end="",
          )
          PY

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            latest.json packages/*
