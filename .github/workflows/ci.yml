# The codegen checks only read IR; the wasm and aarch64 runs execute the force-graph tests there.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pulled in parallel with setup; the tag is cross's version.
      - run: docker pull ghcr.io/cross-rs/aarch64-unknown-linux-gnu:0.2.5
        id: cache-cross
        background: true

      # `fontique` links fontconfig through pkg-config.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
        id: install-deps
        background: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          # `CI` turns a codegen check skipped for a missing target into a failure.
          targets: wasm32-unknown-unknown, wasm32-wasip2, aarch64-linux-android

      - uses: taiki-e/install-action@v2
        id: install-tools
        with:
          # `wasm-bindgen` must match the crate version.
          tool: cargo-nextest, just, wasmtime, cross@0.2.5, wasm-bindgen@0.2.127
        background: true

      - uses: Swatinem/rust-cache@v2
        id: recover-cache
        background: true

      - name: Wait for all test dependencies
        wait: [install-deps, install-tools, recover-cache]

      # `CHROMEWEBDRIVER` names the directory; the `env` context lacks the runner's environment.
      - run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" just test-browser
        background: true

      - run: cargo nextest run --workspace
        background: true

      - run: just test-wasm
        background: true

      - wait: cache-cross
      - run: just test-arm
        background: true

      - wait-all:
