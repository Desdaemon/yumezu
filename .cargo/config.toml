# The force-graph hot loops are written to auto-vectorize. wasm SIMD is not on by default, and
# without it the browser build runs them one lane at a time.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]

# `just test-wasm`. The shipping target cannot run a test binary without a JS host, and this one
# is the same backend, the same feature and the same lane width, so it is what the behaviour of
# the vectorized loops is checked on.
[target.wasm32-wasip2]
rustflags = ["-C", "target-feature=+simd128"]
runner = "wasmtime"
