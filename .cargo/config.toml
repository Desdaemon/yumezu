# Without SIMD the auto-vectorized force-graph loops run one lane at a time.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
# Must match the `wasm-bindgen` crate version.
runner = "wasm-bindgen-test-runner"

# `just test-wasm`: same backend and lane width as the page, without needing a JS host.
[target.wasm32-wasip2]
rustflags = ["-C", "target-feature=+simd128"]
runner = "wasmtime"
